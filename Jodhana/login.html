<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup | Jodhana E-Mitra</title>
    <link rel="stylesheet" href="/login-assets/style.css">

    <!-- Responsive Form -->
    <link rel="stylesheet" href="/login-assets/responsive.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="/firebase-init.js"></script>
</head>

<body>
    <div class="container">
        <!-- Forms Container -->
        <div class="forms-container">
            <div class="signin-signup">
                <!-- Sign in Form -->
                <form action="#" class="sign-in-form" id="loginForm">
                    <h2 class="title">Sign in</h2>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" required placeholder="Email">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" required placeholder="Password">
                    </div>
                    <p id="loginError" style="color: red; display: none; margin-bottom: 10px;"></p>
                    <input type="submit" value="Login" class="btn solid">
                    <div style="margin-top:20px;">
                        <a href="index.html" style="color: #333; text-decoration: none;">&larr; Back to Home</a>
                    </div>
                </form>

                <!-- Sign up Form -->
                <form action="#" class="sign-up-form" id="signupForm">
                    <h2 class="title">Sign up</h2>

                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="signupName" required placeholder="Full Name">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="signupEmail" required placeholder="Email">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="signupPassword" required placeholder="Password">
                    </div>
                    <p id="signupError" style="color: red; display: none; margin-bottom: 10px;"></p>
                    <input type="submit" value="Sign up" class="btn">
                    <div style="margin-top:20px;">
                        <a href="index.html" style="color: #333; text-decoration: none;">&larr; Back to Home</a>
                    </div>
                </form>

            </div>
        </div>

        <!-- Panels Container -->
        <div class="panels-container">
            <!-- Left pannel -->
            <div class="panel left-panel">
                <div class="content">
                    <h3>New here ?</h3>
                    <p>Create an account to track your inquiries and save your personal documents securely in your Document Album.</p>
                    <button class="btn transparent" id="sign-up-btn">Sign up</button>
                </div>
                <img src="/login-assets/img/log.svg" class="image" alt="">
            </div> 

            <!-- Right Panel -->
            <div class="panel right-panel">
                <div class="content">
                    <h3>One of us ?</h3>
                    <p>Already have an account? Login to access your Dashboard, track forms, and view your documents.</p>
                    <button class="btn transparent" id="sign-in-btn">Sign in</button>
                </div>
                <img src="/login-assets/img/register.svg" class="image" alt="">
            </div> 
        </div>
    </div>
</body>
<script src="/login-assets/script.js"></script>
<script>
    // Authentication Logic
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginError = document.getElementById('loginError');
    const signupError = document.getElementById('signupError');

    // Handle Signup
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;

        try {
            const userDoc = await db.collection('users').doc(email).get();
            if (userDoc.exists) {
                signupError.textContent = "Email already exists!";
                signupError.style.display = "block";
                return;
            }

            await db.collection('users').doc(email).set({ name, email, password });
            
            // Auto login (keep currentUser in localStorage for session state)
            localStorage.setItem('currentUser', JSON.stringify({ name, email }));
            window.location.href = 'user-dashboard.html';
        } catch (err) {
            signupError.textContent = "Error signing up: " + err.message;
            signupError.style.display = "block";
        }
    });

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const userDoc = await db.collection('users').doc(email).get();
            
            if (userDoc.exists && userDoc.data().password === password) {
                localStorage.setItem('currentUser', JSON.stringify({ name: userDoc.data().name, email: userDoc.data().email }));
                window.location.href = 'user-dashboard.html';
            } else {
                loginError.textContent = "Invalid email or password!";
                loginError.style.display = "block";
            }
        } catch (err) {
            loginError.textContent = "Error logging in: " + err.message;
            loginError.style.display = "block";
        }
    });

    // Redirect if already logged in
    if (localStorage.getItem('currentUser')) {
        window.location.href = 'user-dashboard.html';
    }
</script>
</html>
